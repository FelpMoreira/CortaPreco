services:
  # ------------------------------------------------------------------ infra
  postgres:
    image: postgres:16-alpine
    container_name: cupons-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cupons
      POSTGRES_PASSWORD: cupons
      POSTGRES_DB: cupons
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - cupons-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cupons"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cupons-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cupons-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------- app (monorepo)
  # Uma imagem base com todas as workspaces; cada serviço roda seu processo.
  # DATABASE_URL/REDIS_URL usam o nome do serviço (rede interna do Compose).
  db-init:
    image: cupons-app:dev
    build:
      context: .
      # build usa a rede do host: em Fedora (systemd-resolved) o DNS do bridge não resolve
      network: host
    # DNS explícito: o 127.0.0.53 do host não é alcançável de dentro dos containers
    dns: [1.1.1.1, 8.8.8.8]
    container_name: cupons-db-init
    restart: "no"
    environment:
      DATABASE_URL: postgresql://cupons:cupons@postgres:5432/cupons?schema=public
    command: ["npm", "run", "db:push"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: cupons-app:dev
    build:
      context: .
      # build usa a rede do host: em Fedora (systemd-resolved) o DNS do bridge não resolve
      network: host
    # DNS explícito: o 127.0.0.53 do host não é alcançável de dentro dos containers
    dns: [1.1.1.1, 8.8.8.8]
    container_name: cupons-api
    restart: unless-stopped
    # todas as variáveis do .env (curadoria, ritmo, lojas...); o bloco environment
    # abaixo só sobrescreve o que muda dentro da rede do Compose
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cupons:cupons@postgres:5432/cupons?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:3001:3001"
    command: ["npm", "run", "dev:api"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  web:
    image: cupons-app:dev
    build:
      context: .
      # build usa a rede do host: em Fedora (systemd-resolved) o DNS do bridge não resolve
      network: host
    # DNS explícito: o 127.0.0.53 do host não é alcançável de dentro dos containers
    dns: [1.1.1.1, 8.8.8.8]
    container_name: cupons-web
    restart: unless-stopped
    # todas as variáveis do .env (curadoria, ritmo, lojas...); o bloco environment
    # abaixo só sobrescreve o que muda dentro da rede do Compose
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cupons:cupons@postgres:5432/cupons?schema=public
      # Dentro da rede do Compose o Next fala com a API pelo nome do serviço
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev:web"]
    depends_on:
      api:
        condition: service_started

  worker:
    image: cupons-app:dev
    build:
      context: .
      # build usa a rede do host: em Fedora (systemd-resolved) o DNS do bridge não resolve
      network: host
    # DNS explícito: o 127.0.0.53 do host não é alcançável de dentro dos containers
    dns: [1.1.1.1, 8.8.8.8]
    container_name: cupons-worker
    restart: unless-stopped
    # todas as variáveis do .env (curadoria, ritmo, lojas...); o bloco environment
    # abaixo só sobrescreve o que muda dentro da rede do Compose
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cupons:cupons@postgres:5432/cupons?schema=public
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev:worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # Conversor do espelhamento (cofre/10): navegador logado na conta de afiliado do Mercado Livre.
  # A sessão fica em ./data/linker (gerada no host por `npm run ml:login`, que precisa de tela).
  linker:
    image: cupons-linker:dev
    build:
      context: .
      target: linker
      # build usa a rede do host: em Fedora (systemd-resolved) o DNS do bridge não resolve
      network: host
    # DNS explícito: o 127.0.0.53 do host não é alcançável de dentro dos containers
    dns: [1.1.1.1, 8.8.8.8]
    container_name: cupons-linker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cupons:cupons@postgres:5432/cupons?schema=public
      REDIS_URL: redis://redis:6379
      LINKER_DATA_DIR: /app/data/linker
    volumes:
      - ./data/linker:/app/data/linker
    # o Chromium usa /dev/shm; os 64 MB padrão derrubam abas pesadas
    shm_size: 1gb
    command: ["npm", "run", "dev", "-w", "@cupons/linker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  bot:
    image: cupons-app:dev
    build:
      context: .
      # build usa a rede do host: em Fedora (systemd-resolved) o DNS do bridge não resolve
      network: host
    # DNS explícito: o 127.0.0.53 do host não é alcançável de dentro dos containers
    dns: [1.1.1.1, 8.8.8.8]
    container_name: cupons-bot
    # on-failure: volta sozinho se cair (código ≠ 0); sem token ele sai com 0 (desativado) e não fica em loop
    restart: on-failure
    # todas as variáveis do .env (curadoria, ritmo, lojas...); o bloco environment
    # abaixo só sobrescreve o que muda dentro da rede do Compose
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cupons:cupons@postgres:5432/cupons?schema=public
      REDIS_URL: redis://redis:6379
    command: ["sh", "-c", "if [ -z \"$TELEGRAM_BOT_TOKEN\" ]; then echo '[bot] TELEGRAM_BOT_TOKEN ausente — bot desativado'; exit 0; fi; exec npm run dev:bot"]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

volumes:
  cupons-pgdata:
  cupons-redisdata: